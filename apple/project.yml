name: CRMDeliveryApple

options:
  bundleIdPrefix: com.horizend.crmdelivery
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Shared:
    type: framework
    platform: iOS
    sources:
      - shared/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizend.crmdelivery.shared
        GENERATE_INFOPLIST_FILE: YES

  AdminApp:
    type: application
    platform: iOS
    sources:
      - admin-app/Sources
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizend.crmdelivery.admin
        INFOPLIST_FILE: admin-app/Info.plist

  CustomerApp:
    type: application
    platform: iOS
    sources:
      - customer-app/Sources
    dependencies:
      - target: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.horizend.crmdelivery.customer
        INFOPLIST_FILE: customer-app/Info.plist
